location / {

  # Set max upload size
  client_max_body_size 20m;

  proxy_pass       http://127.0.0.1:__PORT__/;

  include proxy_params_no_auth;
  proxy_redirect   default;

}

location /static/ {
  alias __INSTALL_DIR__/static/;
}

location /media/ {
  alias __DATA_DIR__/media/;
}
location /ps/ {
  proxy_pass http://127.0.0.1:__PORT_PS__/;
  include proxy_params_no_auth;
}
